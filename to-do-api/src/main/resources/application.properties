spring.application.name=to-do-api


# Server Configuration
spring.datasource.username=${DB_USERNAME:dbUserName}
spring.datasource.password=${DB_PASSWORD:dbPassword}
spring.datasource.url=jdbc:mysql://${DB_HOST:dbHost}:${DB_PORT:dbPort}/${DB_NAME:dbName}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true


# Mail Configuration
spring.mail.host=${MAIL_HOST:mailHost}
spring.mail.port=${MAIL_PORT:mailPort}
spring.mail.username=${MAIL_USERNAME: mailUsername}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


#jwt
application.jwt.access-token.secret=${JWT_ACCESS_TOKEN_SECRET:jwtAccessToken}
application.jwt.refresh-token.secret=${JWT_REFRESH_TOKEN_SECRET:jwtRefreshToken}
application.jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION:9000000}
application.jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
application.jwt.issuer=${JWT_ISSUER:viet.ngdang.dev}


#oauth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:googleClientId}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:googleClientSecret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}


#server
server.forward-headers-strategy=framework


#config
spring.config.import=optional:configserver:${CONFIG_SERVER:http://localhost:8087}
spring.cloud.config.fail-fast=true
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=2000
spring.cloud.config.retry.max-attempts=5
spring.cloud.config.retry.multiplier=1.5


#rabbitmq
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:password}

management.endpoints.web.exposure.include=*


#payos
payos.client-id=${PAYOS_CLIENT_ID:your-client-id}
payos.api-key=${PAYOS_API_KEY:your-api-key}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:your-checksum-key}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:4200/payos-return}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:4200/payos-cancel}