spring.application.name=to-do-api


# Server Configuration
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:to-do-db}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true


# Mail Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:no-reply@gmail.com}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


#jwt
application.jwt.access-token.secret=${JWT_ACCESS_TOKEN_SECRET:3db39987bc03a7e3836dd8389c245875286bb06f20a3947e87a89bff76d01e93}
application.jwt.refresh-token.secret=${JWT_REFRESH_TOKEN_SECRET:01732f6be6bef77d3b22f26b5dc2574a497ec0aef55b3f803063c3a4bd24d050}
application.jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000} 
application.jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000} 
application.jwt.issuer=${JWT_ISSUER:viet.ngdang.dev}
