<form #filterForm="ngForm" class="p-3 border rounded">
  <div class="form-check">
    <p>Category</p>
    @for (category of categories(); track category.id) {
    <input
      class="form-check-input"
      type="checkbox"
      class="mx-3"
      (change)="toggleCategory(category.id, $event)"
    />
    <label class="form-check-label" for="flexCheckDefault">
      {{ category.title }}
    </label>
    }
  </div>
  <div class="form-check">
    <p>Tag</p>
    @for (tag of tags(); track tag.id) {
    <input
      class="form-check-input"
      type="checkbox"
      class="mx-3"
      (change)="toggleTag(tag.id, $event)"
    />
    <label class="form-check-label" for="flexCheckDefault">
      {{ tag.title }}
    </label>
    }
  </div>
  <div class="form-check">
    <p>Status</p>
    <input
      class="form-check-input"
      type="checkbox"
      class="mx-3"
      (change)="toggleStatus(StatusValue.DONE, $event)"
    />
    <label class="form-check-label" for="flexCheckDefault">
      {{ StatusValue.DONE }}
    </label>

    <input
      class="form-check-input"
      type="checkbox"
      (change)="toggleStatus(StatusValue.IN_PROGRESS, $event)"
      class="mx-3"
    />
    <label class="form-check-label" for="flexCheckDefault">
      {{ StatusValue.IN_PROGRESS }}
    </label>

    <input
      class="form-check-input"
      type="checkbox"
      [(value)]="StatusValue.TO_DO"
      class="mx-3"
      (change)="toggleStatus(StatusValue.TO_DO, $event)"
    />
    <label class="form-check-label" for="flexCheckDefault">
      {{ StatusValue.TO_DO }}
    </label>
  </div>

  <div class="form-check">
    <p>Priority</p>
    <input
      class="form-check-input"
      type="checkbox"
      class="mx-3"
      (change)="togglePriority(3, $event)"
    />
    <label class="form-check-label" for="flexCheckDefault"> High </label>

    <input
      class="form-check-input"
      type="checkbox"
      class="mx-3"
      (change)="togglePriority(2, $event)"
    />
    <label class="form-check-label" for="flexCheckDefault"> Medium </label>

    <input
      class="form-check-input"
      type="checkbox"
      class="mx-3"
      (change)="togglePriority(1, $event)"
    />
    <label class="form-check-label" for="flexCheckDefault"> Low </label>
  </div>
  <div>
    <button class="btn btn-primary mt-3" (click)="applyFilter()">
      Apply Filter
    </button>
    <button class="btn btn-secondary mt-3 mx-3" (click)="clearFilter()">
      Clear Filter
    </button>
  </div>
</form>
