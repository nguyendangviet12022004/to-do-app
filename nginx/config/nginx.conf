worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream backend {
        least_conn;
        server api-1:8080;
        server api-2:8080;
        server api-3:8080;
    }
    server {
        listen 8080;

        server_name localhost;

        return 307 https://$host$request_uri;

    }

    server {
        listen 443 ssl;

        server_name localhost;

        ssl_certificate /etc/nginx/ssl/todo-api-ssl.pem;
        ssl_certificate_key /etc/nginx/ssl/todo-api-ssl.key;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://backend;
        }
    }
}
